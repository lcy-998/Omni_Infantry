version: "4.1"
name: ChassisTest
type: ARM
deviceName: null
packDir: null
srcDirs:
  - Core
  - Drivers
  - Middlewares
  - bsp
  - module
  - application
virtualFolder:
  name: <virtual_root>
  files: []
  folders:
    - name: startup
      files:
        - path: startup_stm32f407xx.s
      folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: 03a8b431990c14d759b8128387313c4f
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
        - USE_HAL_DRIVER
        - STM32F407xx
        - ARM_MATH_CM4
      incList:
        - Core/Inc
        - Drivers/STM32F4xx_HAL_Driver/Inc
        - Drivers/STM32F4xx_HAL_Driver/Inc/Legacy
        - Middlewares/Third_Party/FreeRTOS/Source/include
        - Middlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS_V2
        - Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM4F
        - Drivers/CMSIS/Device/ST/STM32F4xx/Include
        - Drivers/CMSIS/Include
        - Middlewares/ST/ARM/DSP/Inc
        - bsp/can
        - module/motor/DJImotor
        - module/motor
        - module/algorithm
        - module
        - bsp/usart
        - module/remote_control
        - module/daemon
        - application
        - application/Chassis
        - module/message_center
        - application/Cmd
        - bsp/spi
        - bsp/pwm
        - bsp/gpio
        - module/BMI088
        - module/imu
        - bsp/dwt
        - application/Gimbal
        - bsp
        - application/Shoot
      libList:
        - Middlewares/ST/ARM/DSP/Lib
    excludeList:
      - application/startup_stm32f407xx.s
      - application/Gimbal/Gimbal.cpp
      - <virtual_root>/scout.c
    toolchain: GCC
    toolchainConfigMap:
      GCC:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: single
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler: {}
          beforeBuildTasks: []
          c/cpp-compiler:
            language-c: c11
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-debug
            warnings: all-warnings
          global:
            $float-abi-type: hard
            misc-control: --specs=nosys.specs --specs=nano.specs
            output-debug-info: enable
          linker:
            $toolName: auto
            LIB_FLAGS: -lm -l:libarm_cortexM4lf_math.a
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: STM32F407IGHx_FLASH.ld
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: "null"
          vendor: "null"
        otherCmds: ""
        proType: 1
        speed: 8000
      STLink:
        address: "0x08000000"
        bin: ""
        elFile: None
        optionBytes: .eide/debug.st.option.bytes.ini
        otherCmds: ""
        proType: SWD
        resetMode: default
        runAfterProgram: true
        speed: 4000
    uploader: STLink
